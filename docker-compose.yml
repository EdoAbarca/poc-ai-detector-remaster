services:
  postgres:
    image: postgres:13
    container_name: postgres
    restart: always
    env_file:
      - ./nest-backend/.env
    environment:
      TZ: "America/Santiago"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - ai-detector-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ai-detector-network

  backend:
    build:
      context: ./nest-backend
      dockerfile: Dockerfile
      target: development
    container_name: nest-backend
    ports:
      - "3333:3333"
    depends_on:
      - postgres
    networks:
      - ai-detector-network
    env_file:
      - ./nest-backend/.env
    environment:
      - NODE_ENV=development
    volumes:
      - ./nest-backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
      target: development
    container_name: react-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - ai-detector-network
    environment:
      - NODE_ENV=development
    volumes:
      - ./react-frontend:/app
      - /app/node_modules

  fdgpt:
    build:
      context: ./fast-detect-gpt
      dockerfile: Dockerfile
      target: base
    container_name: fdgpt
    ports:
      - "5000:8001"
    networks:
      - ai-detector-network
    environment:
      - ENVIRONMENT=development
      - FLASK_ENV=development
    volumes:
      - ./fast-detect-gpt/app:/app/app
      - ./fast-detect-gpt/offload:/app/offload
      - ./fast-detect-gpt/cache:/app/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


networks:
  ai-detector-network:

volumes:
  postgres_data:
