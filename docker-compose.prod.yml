services:
  postgres:
    image: postgres:13
    container_name: postgres
    restart: always
    env_file:
      - ./nest-backend/.env
    environment:
      TZ: "America/Santiago"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - ai-detector-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:6
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ai-detector-network
      
  backend:
    build:
      context: ./nest-backend
      dockerfile: Dockerfile
      target: production
    container_name: nest-backend
    ports:
      - "3333:3333"
    depends_on:
      - postgres
    networks:
      - ai-detector-network
    env_file:
      - ./nest-backend/.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
      
  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
      target: production
    container_name: react-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ai-detector-network
    restart: unless-stopped
      
  fdgpt:
    build:
      context: ./fast-detect-gpt
      dockerfile: Dockerfile
      target: production
    container_name: fdgpt
    ports:
      - "5000:8001"
    networks:
      - ai-detector-network
    environment:
      - ENVIRONMENT=production
      - FLASK_ENV=production
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped


networks:
  ai-detector-network:

volumes:
  postgres_data:
