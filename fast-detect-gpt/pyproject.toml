[project]
name = "fast-detect-gpt"
version = "0.1.0"
description = "Fast Detect GPT API with Flask"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "flask>=3.0.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "transformers==4.28.1",
    "datasets==2.12.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "openai>=1.0.0",
    "nltk>=3.8.0",
    "scikit-learn>=1.3.0",
    "accelerate>=0.20.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
