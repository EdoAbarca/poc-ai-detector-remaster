---
name: Super Linter

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get a proper list of changed files within super-linter
          fetch-depth: 0

      - name: Cache Super Linter Docker Image
        uses: actions/cache@v4
        with:
          path: /var/lib/docker
          key: docker-super-linter-${{ runner.os }}-${{ hashFiles('.github/workflows/super-linter.yml') }}
          restore-keys: |
            docker-super-linter-${{ runner.os }}-

      - name: Run Super Linter
        uses: github/super-linter@v6
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Language validation settings
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_TYPESCRIPT_STANDARD: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JAVASCRIPT_STANDARD: true
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_PYTHON_PYLINT: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          
          # Additional validation settings
          VALIDATE_JSON: true
          VALIDATE_BASH: true
          VALIDATE_SHELL_SHFMT: true
          
          # Linter rules locations
          LINTER_RULES_PATH: /
          TYPESCRIPT_ES_CONFIG_FILE: nest-backend/eslint.config.mjs
          JAVASCRIPT_ES_CONFIG_FILE: react-frontend/eslint.config.js
          PYTHON_BLACK_CONFIG_FILE: .python-black
          PYTHON_FLAKE8_CONFIG_FILE: .flake8
          PYTHON_PYLINT_CONFIG_FILE: .pylintrc
          MARKDOWN_CONFIG_FILE: .markdownlint.json
          YAML_CONFIG_FILE: .yamllint.yml
