---
name: CI Pipeline

"on":
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            fast-detect-gpt/.venv
          key: ${{ runner.os }}-pip-${{ hashFiles('fast-detect-gpt/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install frontend dependencies
        working-directory: react-frontend
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: nest-backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: nest-backend
        run: pnpm exec prisma generate

      - name: Install fast-detect-gpt dependencies
        working-directory: fast-detect-gpt
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run fast-detect-gpt tests
        run: make test-fdgpt-cov

      - name: Run frontend tests
        run: make test-frontend-cov

      - name: Run backend tests
        run: make test-backend-cov

      - name: Build Docker images
        run: docker compose build
