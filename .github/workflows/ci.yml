---
name: CI Pipeline

"on":
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: read

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'react-frontend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: react-frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: react-frontend
        run: pnpm test:cov

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'nest-backend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: nest-backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: nest-backend
        run: pnpm exec prisma generate

      - name: Run tests
        working-directory: nest-backend
        run: pnpm run test:cov

  test-fast-detect-gpt:
    name: Test Fast-Detect-GPT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'fast-detect-gpt/requirements.txt'

      - name: Install dependencies
        working-directory: fast-detect-gpt
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: fast-detect-gpt
        run: |
          . .venv/bin/activate
          pytest tests/ --cov=app --cov-report=term-missing
